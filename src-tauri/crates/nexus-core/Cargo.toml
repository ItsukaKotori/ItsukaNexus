[package]
name = "nexus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Rust 原生 async fn in trait 不是对象安全的(无法 Arc<dyn GitOps>),
# async-trait 把方法改写为返回 Pin<Box<dyn Future>> —— 生态标准解
async-trait = "0.1"

[dev-dependencies]
# 集成测试的临时 git repo(gitx)/临时目录,测试结束自动清理
tempfile = "3"

# Unix 进程组 kill(M3 必办#1):killpg(SIGKILL) 需要 libc 的薄封印
[target.'cfg(unix)'.dependencies]
libc = "0.2"
